<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>評分進度總覽 | 中央研究院百年院慶標語徵選</title>
<style>
  :root {
    --wine: #6c0e18;
    --gold: #a7772c;
    --bg: #faf6ef;
    --text: #2c2420;
    --muted: #7a6f66;
    --border: rgba(167, 119, 44, 0.25);
    --ok: #2e7d32;
    --warn: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header { background: var(--wine); color: #ffffff; padding: 20px 24px; }
  header h1 { margin: 0; font-size: 1.15rem; }
  header p { margin: 4px 0 0; font-size: 0.85rem; opacity: 0.85; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }
  .status-bar { text-align: center; padding: 10px; font-size: 0.85rem; color: var(--muted); }
  .judge-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 22px;
    margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
  }
  .judge-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .judge-name { font-size: 1.05rem; font-weight: 700; color: var(--wine); }
  .judge-progress { font-size: 0.85rem; color: var(--muted); }
  .judge-progress.done { color: var(--ok); font-weight: 700; }
  .progress-bar-outer {
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    margin: 10px 0;
    overflow: hidden;
  }
  .progress-bar-inner { height: 100%; background: var(--wine); }
  .missing-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
  .missing-list { font-size: 0.88rem; color: var(--warn); line-height: 1.8; }
  .missing-list .missing-item { display: inline-block; margin-right: 10px; }
  .all-done { font-size: 0.88rem; color: var(--ok); }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>中央研究院百年院慶標語徵選 — 評分進度總覽</h1>
    <p>僅供主辦單位查看，請勿外流此連結</p>
  </header>
  <main>
    <div class="status-bar" id="statusBar">載入中…</div>
    <div id="list"></div>
  </main>

  <script>
    const SHEET_ID = "10cFGVyCSQqGEPjWw7LBs1xs9hevCXWpUfoV2DhU8qYU";
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyaJMLn9os_5o1zpgDZnX_eDAfTv_usm2StPcS2BzOginQ3sfSp5Jb4HhGbdxKdyck9/exec";

    function getToken() {
      const params = new URLSearchParams(window.location.search);
      return params.get("c") || "";
    }

    // 讀入圍名單只是為了拿到完整的序號＋標語清單，用來跟每位委員已評的序號比對
    async function fetchShortlist() {
      const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
        "/gviz/tq?headers=1&tqx=out:json&sheet=" + encodeURIComponent("入圍名單公告");
      const resp = await fetch(url);
      const text = await resp.text();
      const match = text.match(/google\.visualization\.Query\.setResponse\((.*)\);/s);
      if (!match) return [];
      const json = JSON.parse(match[1]);
      if (!json.table || !json.table.rows) return [];
      return json.table.rows
        .map(r => (r.c || []).map(cell => {
          if (!cell) return "";
          if (cell.f !== null && cell.f !== undefined && String(cell.f).trim() !== "") return String(cell.f).trim();
          return cell.v !== null && cell.v !== undefined ? String(cell.v).trim() : "";
        }))
        .map(row => ({ order: row[0], zh: row[6] || "" }))
        .filter(r => r.order && r.zh);
    }

    async function fetchAdminOverview(token) {
      const url = APPS_SCRIPT_URL + "?action=adminOverview&token=" + encodeURIComponent(token);
      const resp = await fetch(url);
      return resp.json();
    }

    function buildJudgeCard(judge, allEntries) {
      const scoredSet = new Set(judge.scoredOrders.map(String));
      const missing = allEntries.filter(e => !scoredSet.has(String(e.order)));
      const total = allEntries.length;
      const done = total - missing.length;
      const percent = total > 0 ? Math.round((done / total) * 100) : 0;

      const card = document.createElement("div");
      card.className = "judge-card";

      const isDone = missing.length === 0;
      card.innerHTML =
        '<div class="judge-head">' +
          '<span class="judge-name"></span>' +
          '<span class="judge-progress' + (isDone ? " done" : "") + '"></span>' +
        '</div>' +
        '<div class="progress-bar-outer"><div class="progress-bar-inner" style="width:' + percent + '%"></div></div>' +
        (isDone
          ? '<div class="all-done">已完成全部評分 ✓</div>'
          : '<div class="missing-label">尚未評分（' + missing.length + ' 件）：</div><div class="missing-list"></div>');

      card.querySelector(".judge-name").textContent = judge.judgeName;
      card.querySelector(".judge-progress").textContent = "已評 " + done + " / " + total + "（" + percent + "%）";

      if (!isDone) {
        const missingList = card.querySelector(".missing-list");
        missing.forEach(e => {
          const span = document.createElement("span");
          span.className = "missing-item";
          span.textContent = "第 " + e.order + " 件";
          missingList.appendChild(span);
        });
      }

      return card;
    }

    async function init() {
      const token = getToken();
      const statusBar = document.getElementById("statusBar");
      const list = document.getElementById("list");

      if (!token) {
        statusBar.textContent = "";
        list.innerHTML = '<div class="empty-state">此連結缺少管理代碼，請確認連結是否正確。</div>';
        return;
      }

      try {
        const results = await Promise.all([fetchShortlist(), fetchAdminOverview(token)]);
        const allEntries = results[0];
        const overview = results[1];

        if (!overview.success) {
          statusBar.textContent = "";
          list.innerHTML = '<div class="empty-state">' + (overview.error || "管理代碼無效") + '</div>';
          return;
        }

        statusBar.textContent = "共 " + allEntries.length + " 件入圍作品，" + overview.judges.length + " 位委員";
        overview.judges.forEach(judge => {
          list.appendChild(buildJudgeCard(judge, allEntries));
        });
      } catch (e) {
        statusBar.textContent = "";
        list.innerHTML = '<div class="empty-state">載入失敗，請重新整理頁面再試一次。</div>';
      }
    }

    init();
  </script>
</body>
</html>
